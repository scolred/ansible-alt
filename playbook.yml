---
- name: Установка КриптоПро, klnagent и KESL на ALT Linux
  hosts: alt
  become: true
  vars:
    remote_dist_dir: "/tmp/distrib"

  tasks:
    - name: Очистить сломанные пакеты KESL перед чистой установкой (если есть)
      ansible.builtin.shell: rpm -e --nodeps kesl kesl-gui || true
      ignore_errors: true

    - name: Создать временную директорию
      ansible.builtin.file:
        path: "{{ remote_dist_dir }}"
        state: directory
        mode: '0755'

    - name: Установить базовые зависимости и заголовочные файлы ядра
      ansible.builtin.raw: apt-get update && apt-get install -y cryptopro-preinstall pcsc-lite pcscd newt52 kernel-headers-modules-std-def kernel-headers-modules-un-def || true

    # --- 1. КРИПТОПРО ---
    - name: Скопировать дистрибутив КриптоПро
      ansible.builtin.copy:
        src: files/cryptopro/
        dest: "{{ remote_dist_dir }}/cryptopro/"

    - name: Принудительная установка строго указанных пакетов КриптоПро
      ansible.builtin.shell: |
        cd {{ remote_dist_dir }}/cryptopro
        PACKAGES=(
          lsb-cprocsp-base-*.rpm
          lsb-cprocsp-capilite-*.rpm
          lsb-cprocsp-kc1-*.rpm
          lsb-cprocsp-rdr-*.rpm
          cprocsp-curl-*.rpm
          cprocsp-cptools-gtk-*.rpm
          cprocsp-rdr-gui-gtk-*.rpm
          cprocsp-rdr-rutoken-*.rpm
          cprocsp-rdr-jacarta-*.rpm
          cprocsp-rdr-pcsc-*.rpm
          lsb-cprocsp-pkcs11-*.rpm
          ifd-rutokens*.rpm
          cprocsp-pki-cades-64*.rpm
          cprocsp-pki-plugin-64*.rpm
        )
        rpm -Uvh --replacepkgs --force "${PACKAGES[@]}" || true
      register: cp_install
      changed_when: cp_install.rc == 0

    - name: Настроить считыватели и включить службы КриптоПро
      ansible.builtin.shell: |
        /opt/cprocsp/sbin/amd64/cpconfig -hardware reader -add HDIMAGE store 2>/dev/null || true
        /opt/cprocsp/sbin/amd64/cpconfig -hardware reader -add FLASH store 2>/dev/null || true
        systemctl enable --now cprocsp || true
        systemctl enable --now pcscd || true

    - name: Создать симлинки для вызова утилит из консоли
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
        force: true
      loop:
        - { src: '/opt/cprocsp/bin/amd64/certmgr', dest: '/usr/local/bin/certmgr' }
        - { src: '/opt/cprocsp/bin/amd64/csptest', dest: '/usr/local/bin/csptest' }
        - { src: '/opt/cprocsp/sbin/amd64/cpconfig', dest: '/usr/local/bin/cpconfig' }
        - { src: '/opt/cprocsp/bin/amd64/cptools', dest: '/usr/local/bin/cptools' }

    # --- 2. KASPERSKY AGENT ---
    - name: Создать конфигурацию для klnagent (без жесткой привязки сертификата)
      ansible.builtin.copy:
        dest: "{{ remote_dist_dir }}/klnagent_answers.conf"
        content: |
          KLNAGENT_SERVER=192.168.0.252
          KLNAGENT_PORT=14000
          KLNAGENT_SSLPORT=13000
          KLNAGENT_UPD_TARGET=127373
          KLNAGENT_AUTOINSTALL=1
          KLNAGENT_GW_MODE=1
          EULA_ACCEPTED=1

    - name: Скопировать RPM-пакет Агента
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ remote_dist_dir }}/"
      with_fileglob:
        - "files/klnagent64-*.rpm"

    - name: Установить и привязать klnagent64 к серверу KSC
      ansible.builtin.shell: |
        export KLAUTOANSWERS="{{ remote_dist_dir }}/klnagent_answers.conf"
        rpm -Uvh --replacepkgs --force {{ remote_dist_dir }}/klnagent64*.rpm || true
        /opt/kaspersky/klnagent64/lib/bin/setup/postinstall.pl --auto-answers="{{ remote_dist_dir }}/klnagent_answers.conf" || true
        /opt/kaspersky/klnagent64/bin/klmover -address 192.168.0.252 || true

    - name: Включить службу klnagent64
      ansible.builtin.systemd:
        name: klnagent64
        enabled: true
        state: started
      ignore_errors: true

    # --- 3. KASPERSKY ENDPOINT SECURITY ---
    - name: Создать правильный плоский файл автоответов для KESL
      ansible.builtin.copy:
        dest: "{{ remote_dist_dir }}/kesl_answers.ini"
        content: |
          EULA_AGREED=Yes
          PRIVACY_POLICY_AGREED=Yes
          USE_KSN=No
          UPDATER_SOURCE=SCServer
          UPDATE_EXECUTE=No

    - name: Скопировать RPM-пакеты KESL (Основа + GUI)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ remote_dist_dir }}/"
      with_fileglob:
        - "files/kesl-11*.rpm"
        - "files/kesl-gui-11*.rpm"

    - name: Установить KESL с принудительным принятием EULA
      ansible.builtin.shell: |
        apt-get install -y {{ remote_dist_dir }}/kesl-11*.rpm {{ remote_dist_dir }}/kesl-gui-11*.rpm || rpm -Uvh --force {{ remote_dist_dir }}/kesl-*.rpm
        export KESL_EULA_AGREED=Yes
        export KESL_PRIVACY_POLICY_AGREED=Yes
        export KESL_USE_KSN=No
        /opt/kaspersky/kesl/bin/kesl-setup.pl --autoinstall="{{ remote_dist_dir }}/kesl_answers.ini"
      register: kesl_install

    - name: Включить службу KESL
      ansible.builtin.systemd:
        name: kesl
        enabled: true
        state: started
      ignore_errors: true

    # --- 4. ПРОВЕРКА И ОЧИСТКА ---
    - name: Пауза 20 секунд для обмена сертификатами с KSC
      ansible.builtin.pause:
        seconds: 20

    - name: Проверить статус соединения klnagent
      ansible.builtin.command: /opt/kaspersky/klnagent64/bin/klnagchk
      register: klnagchk_out
      changed_when: false
      ignore_errors: true

    - name: Вывести результат klnagchk в консоль
      ansible.builtin.debug:
        var: klnagchk_out.stdout_lines

    - name: Удалить временные файлы
      ansible.builtin.file:
        path: "{{ remote_dist_dir }}"
        state: absent